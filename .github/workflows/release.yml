name: Release

# Push a tag like v0.1.0 to build the portable exe and publish a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii -Append release\SHA256SUMS.txt
          }
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
