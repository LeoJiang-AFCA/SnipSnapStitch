version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Electron majors are upgraded deliberately (Node/Chromium changes); @electron/packager 20+ needs Node >= 20.11.
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      - dependency-name: '@electron/packager'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
