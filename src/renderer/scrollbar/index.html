<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>Scrolling capture</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .bar { box-sizing: border-box; height: 100%; padding: 10px 14px; background: #1b1d22; color: #e6e8ec; border: 1px solid #343842;
         border-radius: 10px; font: 12px "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; gap: 8px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .title { font-weight: 600; }
  .stat { color: #8b91a0; }
  .msg { color: #b9bfcc; min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.warn { color: #ffb454; }
  .buttons { display: flex; gap: 8px; }
  button { flex: 1; background: #24272e; color: #e6e8ec; border: 1px solid #343842; border-radius: 6px; padding: 6px 8px; font: inherit; cursor: pointer; }
  button:hover { border-color: #4f8cff; }
  button.primary { background: #4f8cff; border-color: #4f8cff; color: #fff; font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<div class="bar">
  <div class="top"><span class="title">Scrolling capture</span><span class="stat" id="stat"></span></div>
  <div class="msg" id="msg">Scroll the content yourself, or press Auto-scroll.</div>
  <div class="buttons">
    <button id="auto">&#9654; Auto-scroll</button>
    <button id="done" class="primary">&#10003; Done (Enter)</button>
    <button id="cancel">&#10005; Cancel (Esc)</button>
  </div>
</div>
<script src="scrollbar.js"></script>
</body>
</html>
